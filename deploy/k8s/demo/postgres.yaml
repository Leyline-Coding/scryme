apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scryme-demo-postgres-data
  namespace: scryme-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scryme-demo-postgres
  namespace: scryme-demo
  labels:
    app: scryme-demo-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate  # single RWO volume, never two pods attached at once
  selector:
    matchLabels:
      app: scryme-demo-postgres
  template:
    metadata:
      labels:
        app: scryme-demo-postgres
    spec:
      automountServiceAccountToken: false
      # Run directly as the image's `postgres` user (uid/gid 70 in the Alpine image; the Debian
      # image uses 999 -- change these if you switch variants). Without this the entrypoint starts
      # as root, chowns the data directory and then drops to postgres, which needs the CHOWN /
      # SETUID / SETGID capabilities dropped below. A data directory initialised that way is
      # already owned by uid 70, so an existing volume keeps working.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Pinned to a minor release. Stay on major 16: the data volume will not start under a
          # newer major without a dump/restore.
          image: postgres:16.16-alpine
          # Tuned for the demo's read-heavy trigram/regex search + facets/stats over ~115k cards.
          # Stock defaults (shared_buffers=128MB, work_mem=4MB) thrash the PVC because almost
          # nothing stays cached; these let the hot indexes/table pages stay resident in the 2Gi
          # limit. effective_cache_size is a planner hint (~OS cache), so it steers plans toward
          # index scans without reserving memory.
          args:
            - "-c"
            - "shared_buffers=512MB"
            - "-c"
            - "effective_cache_size=1536MB"
            - "-c"
            - "work_mem=32MB"
            - "-c"
            - "maintenance_work_mem=128MB"
            - "-c"
            - "random_page_cost=1.1"
          env:
            - name: POSTGRES_USER
              value: scryme
            - name: POSTGRES_DB
              value: scryme
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scryme-demo-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Read-only root filesystem: Postgres still needs its socket/lock directory and /tmp.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scryme"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Generous, so heavy searches can still burst, but bounded: the demo is public, and
              # an unlimited Postgres lets a visitor's regex storm starve everything else on the
              # node. Raise it if searches feel slow and the node has cores to spare.
              cpu: "2"
              # Sized for the tuning above (shared_buffers=512MB plus per-query work_mem).
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scryme-demo-postgres-data
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scryme-demo-postgres
  namespace: scryme-demo
spec:
  selector:
    app: scryme-demo-postgres
  ports:
    - port: 5432
      targetPort: 5432
