{# Shared <head>: theme hydration, fonts, styles, and the htmx/alpine bundles. Included by
   base.html (owner pages) and share_base.html (public share views), so the two can't drift on
   theming or CSP-relevant script tags. #}
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}scryme{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <!-- Apply the theme + accent before paint (no flash). Precedence (#203): on a WRITABLE instance
       the server-side preferences singleton wins and is mirrored into localStorage; on the READ-ONLY
       demo a device's own localStorage choice wins, falling back to the injected server default.
       P + writable are injected server-side (no fetch, no window global). P is null when the prefs
       middleware didn't run -> pure-localStorage behavior, exactly as before. -->
  <script>
    (function () {
      try {
        var d = document.documentElement;
        var P = {{ theme_prefs | tojson }};
        // Authoritative = writable AND a preference was actually saved; only then does the server
        // value win over (and get mirrored into) localStorage. A fresh instance's defaults never
        // clobber an existing device's theme.
        var authoritative = {{ 'true' if theme_authoritative else 'false' }};
        function pick(key, serverVal) {
          var ls = localStorage.getItem(key);
          if (authoritative && P && serverVal != null) {
            if (serverVal === "") localStorage.removeItem(key);
            else localStorage.setItem(key, serverVal);
            return serverVal;
          }
          return ls != null ? ls : (P && serverVal != null ? serverVal : null);
        }
        // Migrate the pre-split `scryme-theme` key once (only if that legacy key actually exists).
        var legacy = localStorage.getItem("scryme-theme");
        if (legacy != null && localStorage.getItem("scryme-palette") == null) {
          var map = { midnight: ["midnight", "dark"], slate: ["slate", "dark"],
                      light: ["slate", "light"], parchment: ["midnight", "light"] };
          var m = map[legacy] || ["trop-orange", "dark"];
          localStorage.setItem("scryme-palette", m[0]);
          if (localStorage.getItem("scryme-mode") == null) localStorage.setItem("scryme-mode", m[1]);
        }
        var pal = pick("scryme-palette", P && P.palette) || "trop-orange";
        var mode = pick("scryme-mode", P && P.mode) || "dark";
        d.dataset.theme = pal + "-" + mode;
        var accent = pick("scryme-accent", P ? P.accent : null);
        if (accent) d.style.setProperty("--c-accent", accent);
        // Card-effect settings (foil animation speed, hover spin) — applied before paint.
        var fs = pick("scryme-foil-speed", P ? String(P.foil_speed) : null);
        if (fs) d.style.setProperty("--foil-speed", (11 - Number.parseInt(fs, 10)) + "s");
        var ss = pick("scryme-spin-speed", P ? String(P.spin_speed) : null);
        if (ss) d.style.setProperty("--spin-speed", ((12 - Number.parseInt(ss, 10)) * 0.06).toFixed(2) + "s");
        var spin = pick("scryme-spin", P ? (P.spin ? "1" : "0") : null);
        if (spin !== "0") d.classList.add("spin-on");  // default on (null or "1")
        // Grid card size (1–10 -> 6rem–15rem min column width). Applied before paint so the grid
        // doesn't reflow after load.
        var cs = pick("scryme-card-size", P ? String(P.card_size) : null);
        if (cs) d.style.setProperty("--card-min", (5 + Number.parseInt(cs, 10)) + "rem");
      } catch (e) {
        console.warn("theme init skipped (storage unavailable):", e);
      }
    })();
  </script>
  <!-- Tailwind via CDN keeps the app a single pure-Python service; swap for a build step later. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Map Tailwind color utilities to the semantic CSS-variable tokens defined in app.css.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "var(--c-bg)",
            surface: "var(--c-surface)",
            "surface-2": "var(--c-surface-2)",
            "surface-3": "var(--c-surface-3)",
            edge: "var(--c-edge)",
            fg: "var(--c-fg)",
            muted: "var(--c-muted)",
            accent: "var(--c-accent)",
            "accent-fg": "var(--c-accent-fg)",
          },
          fontFamily: {
            title: ['"Cinzel"', "serif"],
            card: ['"EB Garamond"', "Garamond", "serif"],
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          crossorigin="anonymous" defer></script>
  <script>
    // htmx does not swap non-2xx responses. A 409 from a concurrent-edit conflict (#207) carries
    // the panel's current state as its body — the whole point is to show the editor what the row
    // is now — so allow that one status through and don't treat it as a transport error.
    document.addEventListener('htmx:beforeSwap', function (e) {
      if (e.detail.xhr && e.detail.xhr.status === 409) {
        e.detail.shouldSwap = true;
        e.detail.isError = false;
      }
    });
  </script>
  <script src="https://unpkg.com/alpinejs@3.15.12/dist/cdn.min.js"
          integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L"
          crossorigin="anonymous" defer></script>
  <!-- MTG symbol fonts (Mana = mana pips, Keyrune = set symbols); see static/vendor/*/NOTICE. -->
  <link rel="stylesheet" href="/static/vendor/mana/mana.css" />
  <link rel="stylesheet" href="/static/vendor/keyrune/keyrune.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
