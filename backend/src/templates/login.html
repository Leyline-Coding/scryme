{% extends "base.html" %}
{% block title %}Sign in · scryme{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-4 py-24 text-center">
  {% include "_brand.html" %}
  <h1 class="mt-8 text-lg font-semibold">Sign in</h1>
  <p class="mt-2 text-muted text-sm">This scryme instance is protected by an access token.</p>
  {% if error %}
  <p class="mt-4 text-sm text-red-500" role="alert">{{ error }}</p>
  {% endif %}
  <form action="/login" method="post" class="mt-6 flex gap-2">
    <input type="hidden" name="next" value="{{ next }}" />
    <input type="password" name="token" autofocus autocomplete="current-password"
      placeholder="access token" aria-label="Access token"
      class="flex-1 rounded-lg bg-surface border border-edge px-4 py-2
             focus:outline-none focus:ring-2 focus:ring-accent" />
    <button type="submit"
      class="rounded-lg bg-accent text-accent-fg px-4 py-2 font-medium hover:opacity-90">Sign in</button>
  </form>
</div>
{% endblock %}
