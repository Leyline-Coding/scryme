{# Tag editor for one collection_card. Re-rendered (outerHTML swap) after each add/remove. #}
<div id="card-tags" class="flex flex-wrap items-center gap-1.5">
  {% if s.tags %}
  {% for t in s.tags %}
  <span class="inline-flex items-center gap-1 rounded bg-surface-2 text-xs px-2 py-0.5">
    {{ t }}
    {% if not read_only %}
    <button type="button" title="Remove tag" class="text-muted hover:text-rose-500 leading-none tap"
            hx-post="/collection/bulk"
            hx-vals='{"stack_ids": {{ s.id }},"bulk_action": "tag-remove", "refresh": true, "tag": "{{ t }}"}'
            hx-target="#card-tags" hx-swap="outerHTML"><i class="fa-solid fa-circle-xmark"></i></button>
    {% endif %}
  </span>
  {% endfor %}
  {% endif %}
  {% if read_only %}<span class="text-xs text-muted">No tags.</span>{% endif %}

  {% if not read_only %}
  <form class="inline-flex" hx-post="/collection/bulk"
        hx-target="#card-tags" hx-swap="outerHTML" hx-on::after-request="this.reset()">
    <input type="hidden" name="stack_ids" value="{{ s.id }}" />
    <input type="hidden" name="bulk_action" value="tag" />
    <input type="hidden" name="refresh" value="True" />
    <input type="text" name="tag" maxlength="64" placeholder="+ tag"
           class="w-24 rounded bg-surface-2 text-xs px-2 py-0.5 outline-none focus:ring-1 focus:ring-accent" />
  </form>
  {% endif %}
</div>
