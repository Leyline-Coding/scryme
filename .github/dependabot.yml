# Dependabot keeps dependencies patched and surfaces security advisories as PRs.
# Security updates (for known vulnerabilities) are always opened individually and
# promptly; the version updates below are the routine, grouped housekeeping stream.
version: 2
updates:
  # Backend Python deps (requirements.txt + requirements-dev.txt).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Collapse routine minor/patch bumps into one PR to cut review noise;
      # majors still come through on their own so they get a deliberate look.
      backend-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - area:ci

  # Docs toolchain (MkDocs) pinned in docs/docs-requirements.txt. Scoped to /docs so it doesn't
  # also scan backend/ (a `directory: /` here recurses and duplicates the backend PRs).
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - area:ci

  # Desktop (Electron) app dependencies.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      desktop-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - area:ci

  # The GitHub Actions used by our workflows. They are pinned to full commit SHAs with the release
  # in a trailing comment (`uses: owner/action@<sha> # v1.2.3`); Dependabot bumps both together,
  # so keep that exact comment form when adding an action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-all:
        patterns:
          - "*"
    labels:
      - dependencies
      - area:ci

  # Base images in the Dockerfiles (backend/Dockerfile, backend/Dockerfile.dev,
  # desktop/backend.Dockerfile) and the image tags/digests in the demo's Kubernetes manifests.
  - package-ecosystem: docker
    directories:
      - /backend
      - /desktop
      - /deploy/k8s/demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The Python minor version is a deliberate choice shared with CI, the desktop build and
      # sonar-project.properties -- bump it by hand, everywhere at once.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # A PostgreSQL major upgrade needs a dump/restore of the data volume; never automatic.
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - area:ci

  # Image tags in docker-compose.yml / docker-compose.dev.yml (postgres, nginx).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - area:ci
