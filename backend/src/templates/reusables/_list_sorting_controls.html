{% macro list_sorting_controls(url, sort_by, sort_dir, seperator="?", sort_by_name=True, sort_by_updated_at=True, sort_by_price=False, sort_by_quantity=True ) %}
<div class="flex justify-start gap-2 md:mb-4">
  <a href="{{url}}{{seperator}}sort_by={{ sort_by }}&sort_dir={{ 'desc' if sort_dir == 'asc' else 'asc' }}"
    class="rounded-full bg-surface border border-edge px-4 py-2 text-sm font-medium hover:border-accent {{ 'ring-2 ring-offset-2 ring-accent' if sort_dir == 'desc' else '' }}">
    {% if sort_dir == 'desc' %}<i class="fa-solid fa-arrow-down-wide-short"></i>{% else %}<i class="fa-solid fa-arrow-down-short-wide"></i>{% endif %}
  </a>
  <form hx-get="{{url}}">
    <input type="hidden" name="sort_dir" value="{{ sort_dir }}">
    <select name="sort_by" title="Sort by" class="rounded-full bg-surface border border-edge px-4 py-2 text-sm font-medium hover:border-accent" onchange="this.form.submit()">
      {% if sort_by_name %}<option value="name" {% if sort_by == 'name' %}selected{% endif %}>Name</option>{% endif %}
      {% if sort_by_price %}<option value="price" {% if sort_by == 'price' %}selected{% endif %}>Price</option>{% endif %}
      {% if sort_by_updated_at %}<option value="updated_at" {% if sort_by == 'updated_at' %}selected{% endif %}>Updated</option>{% endif %}
      {% if sort_by_quantity %}<option value="quantity" {% if sort_by == 'quantity' %}selected{% endif %}>Quantity</option>{% endif %}
    </select>
  </form>
</div>
{% endmacro %}
