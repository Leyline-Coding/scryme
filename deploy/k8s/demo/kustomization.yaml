apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scryme-demo

# Apply your secret first (see secret.example.yaml); it is intentionally not part of this
# kustomization so credentials never live in git.
resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - autodeploy.yaml
  # Default-deny + allow-list. Read the note at the top of the file before the first apply: it
  # assumes where cloudflared runs, and a wrong guess takes the demo offline.
  - networkpolicy.yaml

# The tag the manifests start from. Once running, the autodeploy CronJob replaces it on the live
# Deployment with the digest this tag resolves to (see autodeploy.yaml).
images:
  - name: ghcr.io/leyline-coding/scryme
    newTag: latest
