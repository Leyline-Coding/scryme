name: CodeQL

# GitHub's first-party SAST. Results land in the repo's Security > Code scanning tab
# and annotate PRs. Free for public repositories.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan (Mondays 07:00 UTC) catches newly-published query updates
    # even when the code hasn't changed.
    - cron: "0 7 * * 1"

# Default for any job that doesn't say otherwise; the analyze job widens it below.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python            # backend/
            build-mode: none
          - language: javascript-typescript  # desktop/ (Electron)
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Path exclusions for both the security and Code Quality query suites (e.g. Alembic
          # migrations, whose required module globals are false "unused" positives).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
