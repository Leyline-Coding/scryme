name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lint, audit and tests only read the repository.
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scryme
          POSTGRES_PASSWORD: scryme
          POSTGRES_DB: scryme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scryme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCRYME_DATABASE_URL: postgresql+asyncpg://scryme:scryme@localhost:5432/scryme_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Run tests
        run: pytest tests/
