{# A pie of `data` ({label: number}). Slice colours come from the active theme (#409) unless
   `colors` pins them; a legend below carries each slice's name and value, so no slice is
   identified by colour alone. #}
{% macro pie_chart(data, id, width=150, colors=None) %}
  <div class="relative mx-auto block" style="width: {{width}}px; height: {{width}}px;">
    <canvas id="{{ id }}" width="{{width}}" height="{{width}}" class="max-w-[{{width}}px] mx-auto"
            role="img" aria-label="Pie chart; the values are listed below."></canvas>
  </div>
  <ul id="{{ id }}-legend" class="mt-3 flex flex-wrap justify-center gap-x-3 gap-y-1 text-xs"></ul>
  <script>
    // Wrapped so that two charts on one page don't collide on their top-level names.
    (function () {
      const el = document.getElementById({{ id | tojson }});
      const legend = document.getElementById({{ (id ~ "-legend") | tojson }});

      const rawData = {{ data | tojson }} || {};
      // Largest first, so the biggest slice is the one that wears the accent's hue.
      const entries = Object.entries(rawData).map(([k, v]) => [k, Number(v)]).sort((a, b) => b[1] - a[1]);
      const labels = entries.map(e => e[0]);
      const values = entries.map(e => e[1]);
      const totalSum = values.reduce((a, b) => a + b, 0);

      const theme = scrymeChartPalette.fromTheme(labels.length);
      const pinned = {{ colors | tojson }};
      const colors = pinned ? labels.map((_, i) => pinned[i % pinned.length]) : theme.colors;

      labels.forEach((label, i) => {
        const item = document.createElement('li');
        item.className = 'flex items-center gap-1.5';
        const swatch = document.createElement('span');
        swatch.className = 'inline-block h-2.5 w-2.5 rounded-sm';
        swatch.style.backgroundColor = colors[i];
        const name = document.createElement('span');
        name.className = 'text-fg';
        name.textContent = label;
        const count = document.createElement('span');
        count.className = 'text-muted tabular-nums';
        count.textContent = values[i].toLocaleString();
        item.append(swatch, name, count);
        legend.append(item);
      });

      new Chart(el, {
        type: 'pie',
        plugins: [ChartDataLabels],
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: colors,
            // A thin gap in the surface colour keeps neighbouring slices apart.
            borderColor: theme.surface,
            borderWidth: labels.length > 1 ? 2 : 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              display: false
            },
            datalabels: {
              // Black or white, whichever reads on that slice.
              color: (ctx) => scrymeChartPalette.inkOn(colors[ctx.dataIndex]),
              font: {
                weight: 'bold',
                size: 11
              },
              // Formatter outputs the Category Name directly onto the slice
              formatter: (value, ctx) => {
                return ctx.chart.data.labels[ctx.dataIndex];
              },
              // Core Logic: Only display if the slice is >= 15% of the total chart size
              display: (ctx) => {
                const value = ctx.dataset.data[ctx.dataIndex];
                const percentage = (value / totalSum) * 100;
                return percentage >= 15; // Hides tiny slices to prevent text overlapping
              }
            }
          }
        }
      });
    })();
  </script>
{% endmacro %}
