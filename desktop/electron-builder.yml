appId: app.scryme.desktop
productName: scryme
executableName: scryme
copyright: Leyline Coding

directories:
  output: release
  buildResources: build

# Auto-update source. electron-updater pulls the latest release + the generated latest*.yml from
# GitHub Releases. The desktop-release CI workflow publishes here on each tagged release.
publish:
  provider: github
  owner: Leyline-Coding
  repo: scryme
  # Upload to the already-published release for the tag (default is "draft", which electron-builder
  # refuses to attach to an existing published release).
  releaseType: release

# The frozen backend (built separately by `npm run build:backend`) ships as an extra resource so it
# lands at resources/backend/ — where src/main.js looks for it. asar can't hold an executable, so it
# stays unpacked.
extraResources:
  - from: dist/scryme-backend
    to: backend

# The app's own code ships in app.asar (and, with the fuses below, is the only place Electron will
# load it from). embedded-postgres is the exception: it resolves its native PG binaries relative to
# its own location and spawns them, and a path inside an asar is not a real file. So that library,
# the platform binary package and their (pure-JS) dependencies are unpacked to app.asar.unpacked/,
# and src/main.js imports the library from there by absolute path — that way the path it computes
# for the binaries is a real on-disk path. test/unit/packaging.test.js checks this list covers the
# library's whole dependency closure (an import from the unpacked tree cannot reach into the asar).
asar: true
asarUnpack:
  - "node_modules/embedded-postgres/**"
  - "node_modules/@embedded-postgres/**"
  - "node_modules/async-exit-hook/**"
  - "node_modules/pg/**"
  - "node_modules/pg-*/**"
  - "node_modules/pgpass/**"
  - "node_modules/postgres-*/**"
  - "node_modules/split2/**"
  - "node_modules/xtend/**"

# Electron fuses, flipped in the packaged binary (names per @electron/fuses / electron-builder 26).
electronFuses:
  # ELECTRON_RUN_AS_NODE would turn the app binary into a general-purpose Node interpreter.
  runAsNode: false
  # Ignore NODE_OPTIONS / NODE_EXTRA_CA_CERTS and --inspect*: no code injection or debugger
  # attachment into the main process through the environment or command line.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Load the app only from app.asar (not a loose app/ directory dropped next to it)…
  onlyLoadAppFromAsar: true
  # …and validate app.asar against the hash embedded in the binary. Enforced by Electron on macOS
  # and Windows; there is no such check on Linux, where the fuse is inert.
  enableEmbeddedAsarIntegrityValidation: true
  # No page is ever served from file:// (the window only shows the local backend).
  grantFileProtocolExtraPrivileges: false
  # Flipping fuses invalidates the ad-hoc signature every arm64 macOS binary must carry; re-apply it
  # so unsigned builds still launch. A real signing identity, when configured, signs over it.
  resetAdHocDarwinSignature: true

files:
  - "src/**"
  - "package.json"
  - "!**/*.md"

# Icons: electron-builder generates the platform formats (.icns / .ico) from build/icon.png
# (1024×1024) automatically, so only the Linux PNG is specified explicitly.
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  # Signing-ready: with an Apple Developer cert (CSC_LINK/CSC_KEY_PASSWORD) these produce a signed
  # build; set notarize: true and provide APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID to
  # notarize. Harmless for the current unsigned builds. The entitlements let the bundled Postgres +
  # backend run under hardened runtime once signed.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

win:
  target:
    - nsis

linux:
  category: Utility
  # Sync the .desktop entry's StartupWMClass to the app name so Linux desktops associate running
  # windows with the launcher (taskbar/dock grouping). (electron-builder 26 dropped the old string
  # `desktopName` key; `syncDesktopName` is the supported option and needs no separate name.)
  syncDesktopName: true
  # AppImage is the universal, distro-agnostic format. The .deb exists for Ubuntu 24.04+ and other
  # AppArmor distros that restrict unprivileged user namespaces: an AppImage has no fixed path to
  # attach an AppArmor profile to, so there it can only start with Chromium's sandbox switched off
  # (see src/main.js). The .deb installs to /opt/scryme and its postinst loads an AppArmor profile
  # (/etc/apparmor.d/scryme: `profile "scryme" "/opt/scryme/scryme" flags=(unconfined) { userns, }`
  # — electron-builder's built-in deb template, shipped as resources/apparmor-profile), so the
  # sandbox stays on.
  target:
    - AppImage
    - deb
  icon: build/icon.png

deb:
  # Named per architecture so it never collides with the AppImage assets on the release.
  artifactName: "${productName}-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
