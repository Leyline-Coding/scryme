worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/css application/javascript application/json image/svg+xml;
    server_tokens off;

    upstream scryme_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 32m;  # collection CSV uploads

        # Headers the backend uses to learn who the client really is (it rate-limits per client
        # address and checks the Host). Declared once at server level so every proxying location
        # below inherits the same set -- do not add a proxy_set_header inside a location, or that
        # location silently stops inheriting these.
        #
        # In this compose stack nginx is the edge: the TCP peer IS the client. So X-Forwarded-For
        # is REPLACED with $remote_addr, never appended to -- anything the client sent in that
        # header is discarded, and the backend (which trusts this container, see
        # SCRYME_FORWARDED_ALLOW_IPS) cannot be lied to.
        #
        # If you put another proxy in front of this one (Caddy, Traefik, a load balancer), the peer
        # becomes that proxy and every visitor would share its address. Tell nginx which peer to
        # believe, and leave the lines below as they are:
        #     set_real_ip_from 172.16.0.0/12;      # the address/range of YOUR front proxy
        #     real_ip_header   X-Forwarded-For;
        #     real_ip_recursive on;
        # and, if that proxy terminates TLS, forward its scheme instead of ours:
        #     proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # (For Cloudflare, either list its ranges in set_real_ip_from with
        # `real_ip_header CF-Connecting-IP`, or set SCRYME_CLIENT_IP_HEADER=CF-Connecting-IP.)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Serve cached card images straight from the shared data volume.
        location /images/ {
            alias /data/images/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri @backend;
        }

        # Images not cached on disk yet fall through to the app.
        location @backend {
            proxy_pass http://scryme_backend;
        }

        location / {
            proxy_pass http://scryme_backend;
        }
    }
}
